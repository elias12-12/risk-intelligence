# The whole system, from `docker compose up`, on a machine with only Docker.
#
#   docker compose up                 database, bootstrap, API on :8000, console on :5173
#   docker compose up -d db           just the database — what bootstrap.ps1 asks for
#   docker compose run --rm --no-deps api python scripts/demo_burst.py
#   docker compose run --rm console npm test
#
# `--no-deps` on that third line is not decoration. `api` depends on `init`
# COMPLETING, which is right for `up` and wrong for a one-off command: without
# it, running a script against the database first rebuilds the database, and the
# rows the script was about to look at are gone. The console has no such
# dependency for the same reason — see the note on that service.
#
# **`docker compose up --build` after changing Python.** The image COPIES `src/`
# rather than mounting it, so a plain `up` re-runs the image you last built and
# a change you just made is simply not there — the service comes up healthy and
# serves the previous version, which is the least obvious failure in this file.
# The console is the opposite: its source IS bind-mounted, so an edit is what
# Vite serves. The asymmetry is deliberate — `console/dist` has to be written
# where the host can find it — but it means the two services answer "did my edit
# take effect" differently.
#
# THE DATABASE IS REBUILT ON EVERY `up`. `init` runs `scripts/bootstrap_demo.py`,
# which drops and recreates the database before it does anything else, so every
# bring-up is the same demo from the same seed. The cost is stated rather than
# discovered: **rules authored in a previous session do not survive it.** They
# are runtime rows, not seeds — `RF-401` and `C-301` were authored through the
# console and exist in no seed file — so anything authored and wanted again has
# to be authored again, or written into `db/seeds/` where a rebuild will keep it.
# To bring the stack up against the database you already have, skip the
# rebuild: `docker compose up db api console`.
services:
  db:
    image: postgres:16
    container_name: glassbox_pg
    environment:
      POSTGRES_USER: glassbox
      POSTGRES_PASSWORD: glassbox
      POSTGRES_DB: glassbox
    ports:
      # Published for the host: `pytest`, `psql` and every script under
      # `scripts/` reach the database at localhost:55432 exactly as before, and
      # 55432 rather than 5432 so a locally-installed PostgreSQL does not clash.
      # Inside this network the same server is `db:5432`, which is what the DSNs
      # below use.
      - "55432:5432"
    volumes:
      - glassbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glassbox -d glassbox"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrate, seed, load the fixtures, compute features, run both lanes, settle
  # the actions — then exit. One shot, and `api` waits for it to succeed rather
  # than for it to start, so the service never comes up in front of an empty
  # database and answers `/queue` with an honest, useless `[]`.
  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glassbox_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLASSBOX_DSN: postgresql://glassbox:glassbox@db:5432/glassbox
      GLASSBOX_NOW: ${GLASSBOX_NOW:-2026-01-15T15:00:00+00:00}
    command: ["python", "scripts/bootstrap_demo.py"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glassbox_api
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      GLASSBOX_DSN: postgresql://glassbox:glassbox@db:5432/glassbox
      # MANDATORY HERE, not a preference. `config.serve_host` defaults to
      # loopback deliberately — this process commits, and answers an endpoint
      # that can decline a charge — but a container binding its own loopback is
      # unreachable from outside itself, and the failure looks exactly like the
      # service being down. Published port, bound interface: both or neither.
      GLASSBOX_HOST: 0.0.0.0
      GLASSBOX_NOW: ${GLASSBOX_NOW:-2026-01-15T15:00:00+00:00}
      # OFF by default, and this is a demo decision rather than a performance
      # one. With the watermarks at the frontier a tick has nothing to consume
      # and does nothing visible, so the scheduler's only effect on a demo is
      # that rows can appear which no click caused. At 0 every change on screen
      # is traceable to something somebody did. Set it to 30 to watch the
      # background cycle instead; `/cycle` reports which it is, and the console's
      # status strip reads that rather than assuming.
      GLASSBOX_CYCLE_SECONDS: ${GLASSBOX_CYCLE_SECONDS:-0}
    init: true

  # The console. No longer behind a profile: a bare `docker compose up` is meant
  # to bring up everything, which is what §3 of the session plan asks for. The
  # database-only path bootstrap.ps1 depends on is now named explicitly —
  # `docker compose up -d db` — rather than implied by the absence of a profile.
  console:
    build:
      context: ./console
    container_name: glassbox_console
    # DELIBERATELY NO `depends_on`. Vite does not talk to the API at boot — it
    # proxies per request — so the only thing a dependency would buy is startup
    # ordering nobody observes. What it COSTS is much larger: `depends_on: api`
    # inherits api's `init`, and `docker compose run --rm console npm test`
    # would rebuild the demo database before running 47 tests that never touch
    # it. Found by doing exactly that.
    ports:
      - "5173:5173"
    volumes:
      # The source, so an edit on the host is the thing Vite serves — and so
      # `npm run build` writes `console/dist` where `_mount_console` looks for
      # it, on the host, at :8000/console.
      - ./console:/app
      # ...and node_modules NOT from the host, which is the entire point. The
      # named volume also survives `docker compose down`; `-v` is what empties
      # it, and the entrypoint will rebuild it from the lockfile.
      - glassbox_console_modules:/app/node_modules
    environment:
      # Where the dev proxy forwards /api — the `api` service on this network,
      # now that there is one. The DEFAULT in vite.config.ts is still the host,
      # because someone running `python -m glassbox serve` on their own machine
      # and only this container in Docker is still a supported way to work; that
      # case needs GLASSBOX_HOST=0.0.0.0 on the host process, and .env.example
      # carries the pairing.
      GLASSBOX_API: ${GLASSBOX_API:-http://api:8000}
      # Windows bind mounts do not deliver inotify events into a Linux
      # container, so the watcher sees nothing and hot reload silently stops
      # being hot. Polling costs some idle CPU and is the only thing that works
      # here; unset it if you ever run this on a Linux host.
      VITE_POLL: "1"
    extra_hosts:
      # Docker Desktop resolves host.docker.internal already. This is for Linux,
      # where it does not exist unless the gateway is named explicitly.
      - "host.docker.internal:host-gateway"
    # Vite is started by npm, so PID 1 is a shell that does not forward signals.
    # Without an init, stopping the service is a ten-second wait for the kill.
    init: true

volumes:
  glassbox_pgdata:
  glassbox_console_modules:
